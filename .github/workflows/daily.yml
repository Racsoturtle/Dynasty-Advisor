name: Daily dashboard

on:
  schedule:
    # Ready by 7 AM Eastern every day. GitHub's cron is in UTC, so both times
    # are scheduled and the "when" job keeps only the one that is 6:45 AM in
    # New York (the first in summer, the second in winter).
    - cron: "45 10 * * *"
    - cron: "45 11 * * *"
    # GitHub sometimes skips scheduled runs. These later ones refresh only
    # if nothing has refreshed the dashboard yet this morning.
    - cron: "17 13 * * *"
    - cron: "17 15 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      send_summary:
        description: "Also post the weekly summary"
        type: boolean
        default: false
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened]  # "They said no" marks

permissions:
  actions: read  # the backup runs check whether the morning refresh happened
  contents: write  # saves the trade log to the data branch
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          SEND_SUMMARY: ${{ inputs.send_summary }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          zone=$(TZ=America/New_York date +%Z)   # EDT in summer, EST in winter
          go=true
          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE" = "45 10 * * *" ] && [ "$zone" != EDT ]; then go=false; fi
            if [ "$SCHEDULE" = "45 11 * * *" ] && [ "$zone" != EST ]; then go=false; fi
            case "$SCHEDULE" in "17 "*)
              # Backup run: skip if a build already succeeded since 6:40 AM New York time.
              since=$(date -u -d "$(TZ=America/New_York date +%F) 06:40 $(TZ=America/New_York date +%z)" +%FT%TZ)
              for id in $(gh api "repos/$REPO/actions/runs?created=>=$since&per_page=50" --jq '.workflow_runs[].id'); do
                if gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "build" and .conclusion == "success") | .id' | grep -q .; then
                  go=false; break
                fi
              done
              # Before 6:40 AM there's nothing to back up yet.
              [ "$(TZ=America/New_York date +%H%M)" -lt 0640 ] && go=false ;;
            esac
          fi
          # The short summary goes out with the Thursday and Sunday morning builds.
          day=$(TZ=America/New_York date +%u)   # 4 = Thursday, 7 = Sunday
          summary=false
          if [ "$EVENT" = schedule ] && { [ "$day" = 4 ] || [ "$day" = 7 ]; }; then summary=true; fi
          if [ "$SEND_SUMMARY" = true ]; then summary=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "$EVENT '$SCHEDULE' $zone day=$day -> go=$go summary=$summary"

  build:
    needs: when
    # Other people's issues on this public repo don't trigger a rebuild.
    if: needs.when.outputs.go == 'true' && (github.event_name != 'issues' || (startsWith(github.event.issue.title, 'Denied:') && github.event.issue.user.login == github.repository_owner))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Load the trade log
        run: |
          if git fetch -q origin data:refs/remotes/origin/data; then
            git worktree add -q -B data logbook origin/data
          else
            git worktree add -q --orphan -b data logbook
          fi
      - name: Pull league and values, build site
        env:
          GITHUB_TOKEN: ${{ github.token }}  # reads DynastyProcess's file history and "Denied" issues
        run: python -m advisor.main --out site --snapshot snapshot --log logbook/trade_log.json
      - name: Save the trade log
        run: |
          cd logbook
          git add trade_log.json
          if ! git diff --cached --quiet; then
            git -c user.name="dynasty-advisor" -c user.email="actions@users.noreply.github.com" commit -qm "Trade log $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
            git push -q origin data
          fi
      - name: Keep today's raw data for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the "denied" label for They-said-no issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create denied --color c0392b --description "Trade offer they turned down" --force
      - name: Post the weekly summary
        if: needs.when.outputs.summary == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create summary --color 2f6fdb --description "Weekly summary" --force
          for n in $(gh issue list --label summary --state open --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed
          done
          day=$(TZ=America/New_York date +%A)
          gh issue create --label summary --title "$day summary: $(TZ=America/New_York date '+%b %-d')" --body-file site/summary.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
