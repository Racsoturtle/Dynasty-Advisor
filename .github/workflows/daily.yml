name: Daily dashboard

on:
  schedule:
    - cron: "0 11 * * *"  # 7 AM Eastern (6 AM in winter)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Pull league and values, build site
        run: python -m advisor.main --out site --snapshot snapshot
      - name: Keep today's raw data for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
