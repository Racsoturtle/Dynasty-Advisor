name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sleeper from a browser origin
        run: |
          mkdir out
          L=1327317900188487680
          {
            echo "== CORS headers =="
            curl -sS -D - -o /dev/null -H "Origin: https://racsoturtle.github.io" "https://api.sleeper.app/v1/league/$L/rosters" | grep -i -E "^HTTP|access-control|content-type"
            curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://racsoturtle.github.io" -H "Access-Control-Request-Method: GET" "https://api.sleeper.app/v1/state/nfl" | grep -i -E "^HTTP|access-control"
            week=$(curl -sS https://api.sleeper.app/v1/state/nfl | python3 -c "import json,sys; print(json.load(sys.stdin)['week'])")
            echo "== week $week trades =="
            for w in $((week-1)) $week; do
              curl -sS "https://api.sleeper.app/v1/league/$L/transactions/$w" | python3 -c "
          import json,sys,datetime
          for t in json.load(sys.stdin):
              if t['type']=='trade':
                  print($w, t['status'], datetime.datetime.utcfromtimestamp((t.get('status_updated') or t['created'])/1000), t.get('adds'), [(p['season'],p['round'],p['previous_owner_id'],p['owner_id']) for p in t.get('draft_picks') or []])
          "
            done
          } > out/summary3.txt 2>&1
          cat out/summary3.txt
      - name: Push results
        run: |
          cd out
          git init -q -b probe
          git -c user.name=probe -c user.email=probe@example.com add .
          git -c user.name=probe -c user.email=probe@example.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
