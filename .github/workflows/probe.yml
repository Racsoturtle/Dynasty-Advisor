name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cat > probe.py <<'PY'
          import json, os, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"}
          def get(url, headers=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={**UA, **(headers or {})}), timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", 0), str(e)
          out = open("out/summary2.txt", "w")
          def w(*a): out.write(" ".join(str(x) for x in a) + "\n")
          code, body = get("https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=1&numTeams=16&ppr=1")
          fc = json.loads(body)
          picks = [r for r in fc if r["player"]["position"] == "PICK"]
          w("FC PICKS", len(picks), [(r["player"]["name"], r["player"]["id"], r["player"].get("sleeperId")) for r in picks][:40])
          for r in [fc[0]] + picks[:2]:
              code, body = get(f"https://api.fantasycalc.com/trades/implied/{r['player']['id']}?isDynasty=true&numQbs=1&numTeams=16&ppr=1")
              d = json.loads(body) if code == 200 else {}
              h = d.get("historicalValues") or []
              w("FC HIST", r["player"]["name"], code, "keys", list(d.keys()), "n", len(h), h[:1], h[-1:])
              w("   other", json.dumps({k: v for k, v in d.items() if k != "historicalValues"})[:600])
          code, body = get("https://api.fantasycalc.com/trades/implied/" + str(fc[0]['player']['id']) + "?isDynasty=true&numQbs=1&numTeams=16&ppr=1&startDate=2025-06-01")
          w("FC HIST startDate", code, len(json.loads(body).get("historicalValues", [])) if code == 200 else body[:200])
          code, body = get("https://keeptradecut.com/dynasty-rankings/players/bijan-robinson-1414")
          for tag in ("pd-oneqb", "pd-players"):
              m = re.search(r'id="%s"[^>]*>(.*?)</script>' % tag, body, re.S) or re.search(r'<script[^>]*id="%s"[^>]*>(.*?)</script>' % tag, body, re.S)
              if not m:
                  w("KTC", tag, "missing"); continue
              d = json.loads(m.group(1))
              w("KTC", tag, type(d).__name__, len(m.group(1)), list(d.keys())[:30] if isinstance(d, dict) else len(d))
              if isinstance(d, dict):
                  for k, v in d.items():
                      if isinstance(v, list):
                          w("   list", k, len(v), json.dumps(v[:2])[:300], json.dumps(v[-1:])[:200])
                      elif isinstance(v, dict):
                          w("   dict", k, list(v.keys())[:20])
              if isinstance(d, list):
                  w("   first", json.dumps(d[0])[:300])
          i = body.find('"history":[{')
          w("KTC first nonempty history", body[i:i+400] if i >= 0 else "none")
          H = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          code, body = get("https://api.github.com/repos/dynastyprocess/data/commits?path=files/values.csv&per_page=100&since=2025-08-01T00:00:00Z", H)
          rows = json.loads(body) if code == 200 else []
          w("DP COMMITS since 2025-08", len(rows), [r["commit"]["committer"]["date"][:10] for r in rows][::5])
          code, body = get("https://raw.githubusercontent.com/dynastyprocess/data/" + rows[-1]["sha"] + "/files/values.csv")
          w("DP OLD", code, body[:400])
          code, body = get("https://raw.githubusercontent.com/dynastyprocess/data/" + rows[-1]["sha"] + "/files/values-picks.csv")
          w("DP OLD PICKS", code, body[:800])
          trades = []
          for lid in ("1327317900188487680", "1264704578339745792"):
              for leg in range(0, 19):
                  code, body = get(f"https://api.sleeper.app/v1/league/{lid}/transactions/{leg}")
                  trades += [r for r in (json.loads(body) if code == 200 else []) if r.get("type") == "trade"]
          code, body = get("https://api.sleeper.app/v1/players/nfl")
          db = json.loads(body)
          import datetime
          for t in sorted(trades, key=lambda t: t["created"]):
              when = datetime.datetime.utcfromtimestamp(t["created"] / 1000).date()
              sides = {}
              for pid, rid in (t.get("adds") or {}).items():
                  sides.setdefault(rid, []).append(db.get(pid, {}).get("full_name") or pid)
              for p in t.get("draft_picks") or []:
                  sides.setdefault(p["owner_id"], []).append(f"{p['season']} R{p['round']} (orig {p['roster_id']})")
              w("TRADE", when, json.dumps(sides), "faab", t.get("waiver_budget"))
          PY
          python3 probe.py
      - name: Push results
        run: |
          cd out
          git init -q -b probe
          git -c user.name=probe -c user.email=probe@example.com add summary2.txt
          git -c user.name=probe -c user.email=probe@example.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
