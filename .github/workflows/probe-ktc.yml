name: Temporary KTC probe
on:
  push:
    branches: [claude/project-thread-t4uxvn]
    paths: [probe/ktc_probe.py, .github/workflows/probe-ktc.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: mkdir -p probe/out && (python probe/ktc_probe.py > probe/out/result.txt 2>&1 || true); head -c 20000 probe/out/result.txt
      - name: Push results
        run: |
          git config user.name probe && git config user.email probe@example.com
          git add probe/out && git commit -qm "KTC probe results [skip ci]" && git push -q origin HEAD:claude/project-thread-t4uxvn
