name: Probe KeepTradeCut page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and summarize the page
        run: |
          mkdir out
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" \
            -o page.html -w "%{http_code} %{size_download}\n" \
            "https://keeptradecut.com/dynasty-rankings?page=0&filters=QB|WR|RB|TE|RDP&format=1" > out/status.txt
          python3 - <<'PY'
          import re
          html = open("page.html", encoding="utf-8", errors="replace").read()
          out = open("out/summary.txt", "w")
          out.write(f"length {len(html)}\n<title>: {re.findall(r'<title>(.*?)</title>', html, re.S)[:1]}\n\n")
          out.write("var names: " + ", ".join(sorted(set(re.findall(r'(?:var|let|const)\s+(\w+)\s*=', html)))) + "\n\n")
          for word in ("playersArray", "oneQBValues", "Ja'Marr Chase", "Chase", "__NEXT_DATA__", "application/json", "data-player"):
              for m in list(re.finditer(re.escape(word), html))[:2]:
                  s = max(0, m.start() - 300)
                  out.write(f"=== {word} at {m.start()} ===\n{html[s:m.start() + 700]}\n\n")
          import json
          m = re.search(r'<script[^>]*id="ktc-players"[^>]*>(.*?)</script>', html, re.S)
          out.write(f"ktc-players tag found: {bool(m)}\n")
          if m:
              tag = re.search(r'<script[^>]*id="ktc-players"[^>]*>', html).group(0)
              out.write(f"tag: {tag}\n")
              rows = json.loads(m.group(1))
              out.write(f"rows {len(rows)}\n")
              r0 = rows[0]
              out.write("top keys: " + ", ".join(r0.keys()) + "\n")
              q = r0["oneQBValues"]
              out.write("oneQBValues keys: " + ", ".join(f"{k}={v!r}" for k, v in q.items() if not isinstance(v, (dict, list))) + "\n")
              out.write("oneQBValues dict keys: " + ", ".join(k for k, v in q.items() if isinstance(v, dict)) + "\n")
              for r in rows:
                  if r["position"] not in ("QB", "RB", "WR", "TE"):
                      out.write(f"nonplayer: {r['playerName']} | {r['position']} | value={r['oneQBValues'].get('value')}\n")
              ranked = sorted(rows, key=lambda r: -(r["oneQBValues"].get("value") or 0))
              for r in ranked[:5]:
                  out.write(f"top: {r['playerName']} {r['position']} {r['oneQBValues'].get('value')}\n")
          scripts = re.findall(r'<script[^>]*src="([^"]+)"', html)
          out.write("script srcs: " + "\n".join(scripts) + "\n")
          PY
          head -c 3000 page.html > out/head.html
      - name: Push results to the probe branch
        run: |
          cd out
          git init -q -b probe-ktc
          git -c user.name=probe -c user.email=probe@example.com add .
          git -c user.name=probe -c user.email=probe@example.com commit -qm "KTC probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-ktc
