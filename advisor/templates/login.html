<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Dynasty Advisor</title>
<script>
// A profile signed in on this device goes straight to its pages. "Switch
// profile" on any page clears it and comes back here.
try {
  const p = localStorage.getItem("dynasty-advisor:profile");
  if (p && {{ profiles | selectattr("team") | map(attribute="key") | list | tojson }}.includes(p)) location.replace(p + "/index.html");
} catch (e) {}
</script>
<style>
:root { --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e1da; --accent: #2f6fdb; --bad: #c0392b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f; --accent: #7aa7f5; --bad: #ef7b6e; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.who { display: grid; gap: 10px; margin: 20px 0; }
.who button { font: inherit; text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
              background: var(--card); color: var(--ink); cursor: pointer; }
.who button:hover:not(:disabled), .who button.on { border-color: var(--accent); }
.who button.on { box-shadow: 0 0 0 1px var(--accent); }
.who button:disabled { opacity: .55; cursor: default; }
.who b { display: block; font-size: 16px; }
form { display: grid; gap: 10px; }
form[hidden] { display: none; }
input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
form button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dynasty Advisor</h1>
  <div class="muted small">{{ league.name }}. Pick your profile.</div>
  <div class="who">
    {% for p in profiles %}<button type="button" data-key="{{ p.key }}" data-hash="{{ p.password_sha256 }}"{% if not p.team %} disabled{% endif %}>
      <b>{{ p.name }}</b><span class="muted small">{{ p.team or "Team not found in the league today" }}</span></button>
    {% endfor %}
  </div>
  <form id="pw" hidden>
    <label for="password" class="small muted">Password for <span id="who"></span></label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
(function () {
  const form = document.getElementById("pw"), input = document.getElementById("password"), err = document.getElementById("err");
  let picked = null;
  document.querySelectorAll(".who button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".who button").forEach((x) => x.classList.toggle("on", x === b));
    picked = b;
    document.getElementById("who").textContent = b.querySelector("b").textContent;
    form.hidden = false; err.textContent = ""; input.value = ""; input.focus();
  }));
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), (x) => x.toString(16).padStart(2, "0")).join("");
  }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = picked.dataset.key;
    if (await sha256("dynasty-advisor:" + key + ":" + input.value) !== picked.dataset.hash) {
      err.textContent = "Wrong password."; input.select(); return;
    }
    try { localStorage.setItem("dynasty-advisor:profile", key); } catch (x) {}
    location.href = key + "/index.html";
  });
})();
</script>
</body>
</html>
